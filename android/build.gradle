buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'  // Updated for better JDK compatibility
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"  // Updated Kotlin version
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "com.google.firebase:firebase-appdistribution-gradle:5.2.1"
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
