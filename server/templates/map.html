<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Cell Logger Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    #wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #controls {
      padding: 8px 12px;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      flex-shrink: 0;
    }

    #controls label {
      margin-right: 4px;
    }

    #controls select,
    #controls button {
      padding: 4px 8px;
      margin-right: 12px;
    }

    #status {
      padding: 6px 12px;
      background: #e8f4f8;
      border-bottom: 1px solid #bee5eb;
      font-size: 0.9em;
      flex-shrink: 0;
    }

    #gsm-alert-banner {
      display: none;
      padding: 10px 16px;
      background: #f8d7da;
      color: #721c24;
      border-bottom: 2px solid #f5c6cb;
      font-weight: bold;
      flex-shrink: 0;
    }

    #gsm-alert-banner .close-btn {
      float: right;
      cursor: pointer;
      font-size: 1.2em;
      margin-left: 12px;
    }

    #map {
      flex: 1;
    }
  </style>
</head>

<body>
  <div id="wrapper">
    <div id="controls">
      <strong>Cell Logger Map</strong>
      &nbsp;
      <label for="cellIdFilter">Cell ID:</label>
      <select id="cellIdFilter">
        <option value="">All Cell IDs</option>
      </select>

      <label for="typeFilter">Type:</label>
      <select id="typeFilter" onchange="updateMap(false)">
        <option value="">All</option>
        <option value="LTE">LTE (4G)</option>
        <option value="NR">NR (5G)</option>
        <option value="WCDMA">WCDMA (3G)</option>
        <option value="GSM">GSM (2G)</option>
      </select>

      <label for="displayMode">Mode:</label>
      <select id="displayMode">
        <option value="rssi_circles">RSSI Circles</option>
        <option value="heatmap">Heatmap</option>
        <option value="pins">Pins</option>
      </select>

      <button onclick="updateMap(true)">Refresh</button>

      <label><input type="checkbox" id="debugToggle" checked onchange="toggleDebug()"> Debug Circles</label>
    </div>
    <div id="status">Loading…</div>
    <div id="gsm-alert-banner">
      <span class="close-btn" onclick="dismissGsmAlert()">✕</span>
      ⚠ GSM Alert: <span id="gsm-alert-text"></span>
    </div>
    <div id="map"></div>
  </div>

  <script>
    var map = L.map('map').setView([35.68, 139.69], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    var statusEl = document.getElementById('status');

    // Layer groups so we can clear them independently
    var heatLayer = L.layerGroup().addTo(map);
    var pinLayer = L.layerGroup().addTo(map);
    var bsLayer = L.layerGroup().addTo(map);
    var debugLayer = L.layerGroup().addTo(map);

    /* ── RSSI → colour (matches Android Blue→Cyan→Green→Yellow→Red) ──────── */
    function rssiToRgb(rssi) {
      var rssiMin = -120, rssiMax = -20;
      var n = Math.max(0, Math.min(1, (rssi - rssiMin) / (rssiMax - rssiMin)));
      var r, g, b;
      if (n <= 0.25) {
        var f = n / 0.25;
        r = 0; g = Math.round(f * 255); b = 255;
      } else if (n <= 0.5) {
        var f = (n - 0.25) / 0.25;
        r = 0; g = 255; b = Math.round(255 * (1 - f));
      } else if (n <= 0.75) {
        var f = (n - 0.5) / 0.25;
        r = Math.round(f * 255); g = 255; b = 0;
      } else {
        var f = (n - 0.75) / 0.25;
        r = 255; g = Math.round(255 * (1 - f)); b = 0;
      }
      return [r, g, b];
    }

    function rssiToColor(rssi) {
      var c = rssiToRgb(rssi);
      return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    }

    function rssiToFillColor(rssi) {
      var c = rssiToRgb(rssi);
      return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.59)';
    }

    /* ── Grid bucketing (matches Android 25m grid) ───────────────────────── */
    function gridBucket(data, gridSizeMeters) {
      gridSizeMeters = gridSizeMeters || 25;
      var grid = {};
      data.forEach(function (row) {
        if (row.lat == null || row.lon == null) return;
        var rssi = row.rssi != null ? row.rssi : -100;
        var latDeg = gridSizeMeters / 111320.0;
        var lonDeg = gridSizeMeters / (111320.0 * Math.cos(row.lat * Math.PI / 180));
        var gi = Math.floor(row.lat / latDeg);
        var gj = Math.floor(row.lon / lonDeg);
        var key = gi + '_' + gj;
        if (!grid[key] || rssi > grid[key].rssi) {
          grid[key] = { lat: row.lat, lon: row.lon, rssi: rssi, type: row.type, cell_id: row.cell_id, timestamp: row.timestamp };
        }
      });
      var out = [];
      for (var k in grid) out.push(grid[k]);
      return out;
    }

    function loadCellIds() {
      fetch('/cell_ids')
        .then(function (r) { return r.json(); })
        .then(function (ids) {
          var sel = document.getElementById('cellIdFilter');
          var prev = sel.value;
          while (sel.children.length > 1) sel.removeChild(sel.lastChild);
          ids.forEach(function (id) {
            var opt = document.createElement('option');
            opt.value = id;
            opt.textContent = id;
            sel.appendChild(opt);
          });
          if (prev) sel.value = prev;
        })
        .catch(function (e) { console.error('cell_ids error', e); });
    }

    function toggleDebug() {
      var show = document.getElementById('debugToggle').checked;
      if (show) {
        map.addLayer(debugLayer);
      } else {
        map.removeLayer(debugLayer);
      }
    }

    function updateMap(shouldFit) {
      var mode = document.getElementById('displayMode').value;
      var cellId = document.getElementById('cellIdFilter').value;
      var typeFilter = document.getElementById('typeFilter').value;
      statusEl.textContent = 'Loading…';
      heatLayer.clearLayers();
      pinLayer.clearLayers();
      bsLayer.clearLayers();
      debugLayer.clearLayers();

      var bounds = [];

      // Base stations (always shown) with debug circles
      fetch('/cell_map')
        .then(function (r) { return r.json(); })
        .then(function (cells) {
          cells.forEach(function (cell) {
            if (cell.lat == null || cell.lon == null) return;
            if (cellId && cell.cell_id !== cellId) return;
            if (typeFilter && cell.type !== typeFilter) return;

            // Red circle marker for estimated base station (matches Android red marker)
            var bsMarker = L.circleMarker([cell.lat, cell.lon], {
              radius: 8,
              fillColor: '#ff0000',
              color: '#cc0000',
              weight: 2,
              fillOpacity: 0.9
            }).bindPopup(
              '<b>Estimated Base Station</b><br>' +
              'Cell ID: ' + cell.cell_id + '<br>' +
              'Type: ' + (cell.type || 'Unknown') + '<br>' +
              'Observations: ' + cell.count
            );
            bsLayer.addLayer(bsMarker);
            bounds.push([cell.lat, cell.lon]);

            // Debug circles showing estimated distance from each observation
            if (cell.debug && cell.debug.circles) {
              cell.debug.circles.forEach(function (dc) {
                var circle = L.circle([dc.lat, dc.lon], {
                  radius: dc.radius_m,
                  color: 'rgba(102,102,102,0.39)',
                  weight: 1,
                  fillColor: 'transparent',
                  fill: false
                });
                debugLayer.addLayer(circle);
              });
            }
          });
          if (shouldFit) fitIfNeeded(bounds);
        })
        .catch(function (e) { console.error('cell_map error', e); });

      if (mode === 'rssi_circles') {
        // RSSI Circles mode (matches Android RSSI_CIRCLES)
        var url = '/map_data' + (cellId ? '?cell_id=' + encodeURIComponent(cellId) : '');
        fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (typeFilter) {
              data = data.filter(function (row) { return row.type === typeFilter; });
            }
            var bucketed = gridBucket(data, 25);
            bucketed.forEach(function (row) {
              var rssi = row.rssi != null ? row.rssi : -100;
              var cm = L.circleMarker([row.lat, row.lon], {
                radius: 8,
                fillColor: rssiToFillColor(rssi),
                color: 'rgba(0,0,0,0.78)',
                weight: 1,
                fillOpacity: 0.75
              }).bindPopup(
                '<b>Cell Tower Information</b><br>' +
                'Cell ID: ' + (row.cell_id || 'Unknown') + '<br>' +
                'Type: ' + (row.type || 'Unknown') + '<br>' +
                'RSSI: ' + rssi + ' dBm<br>' +
                'Lat: ' + row.lat.toFixed(6) + '<br>' +
                'Lon: ' + row.lon.toFixed(6)
              );
              heatLayer.addLayer(cm);
              bounds.push([row.lat, row.lon]);
            });
            statusEl.textContent = 'RSSI Circles: ' + bucketed.length + ' points (from ' + data.length + ' records)' +
              (cellId ? ' (Cell: ' + cellId + ')' : '') +
              (typeFilter ? ' [' + typeFilter + ']' : '');
            if (shouldFit) fitIfNeeded(bounds);
          })
          .catch(function (e) {
            statusEl.textContent = 'Error loading RSSI circles: ' + e.message;
            console.error(e);
          });

      } else if (mode === 'heatmap') {
        // Heatmap mode with grid bucketing (matches Android heatmap)
        var url = '/map_data' + (cellId ? '?cell_id=' + encodeURIComponent(cellId) : '');
        fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (typeFilter) {
              data = data.filter(function (row) { return row.type === typeFilter; });
            }
            var bucketed = gridBucket(data, 25);
            bucketed.forEach(function (row) {
              var rssi = row.rssi != null ? row.rssi : -100;
              var intensity = Math.max(0.1, Math.min(1.0, (rssi + 120) / 100));
              var cm = L.circleMarker([row.lat, row.lon], {
                radius: Math.max(6, Math.min(18, intensity * 16)),
                fillColor: rssiToColor(rssi),
                color: 'transparent',
                fillOpacity: Math.max(0.3, intensity * 0.8)
              }).bindPopup(
                'Lat: ' + row.lat.toFixed(6) + '<br>' +
                'Lon: ' + row.lon.toFixed(6) + '<br>' +
                'RSSI: ' + rssi + ' dBm<br>' +
                'Type: ' + (row.type || 'Unknown') + '<br>' +
                'Cell: ' + (row.cell_id || 'Unknown')
              );
              heatLayer.addLayer(cm);
              bounds.push([row.lat, row.lon]);
            });
            statusEl.textContent = 'Heatmap: ' + bucketed.length + ' points (from ' + data.length + ' records)' +
              (cellId ? ' (Cell: ' + cellId + ')' : '') +
              (typeFilter ? ' [' + typeFilter + ']' : '');
            if (shouldFit) fitIfNeeded(bounds);
          })
          .catch(function (e) {
            statusEl.textContent = 'Error loading heatmap: ' + e.message;
            console.error(e);
          });

      } else {
        // Pins mode (matches Android Pins)
        var url = '/map_data' + (cellId ? '?cell_id=' + encodeURIComponent(cellId) : '');
        fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (typeFilter) {
              data = data.filter(function (row) { return row.type === typeFilter; });
            }
            data.forEach(function (row) {
              if (row.lat == null || row.lon == null) return;
              var rssi = row.rssi != null ? row.rssi : -100;
              var cm = L.circleMarker([row.lat, row.lon], {
                radius: 6,
                fillColor: '#4286f4',
                color: '#333',
                weight: 1,
                fillOpacity: 0.75
              }).bindPopup(
                'Type: ' + (row.type || 'Unknown') + '<br>' +
                'RSSI: ' + rssi + ' dBm<br>' +
                'Cell: ' + (row.cell_id || 'Unknown')
              );
              pinLayer.addLayer(cm);
              bounds.push([row.lat, row.lon]);
            });
            statusEl.textContent = 'Pins: ' + data.length + ' points' +
              (cellId ? ' (Cell: ' + cellId + ')' : '') +
              (typeFilter ? ' [' + typeFilter + ']' : '');
            if (shouldFit) fitIfNeeded(bounds);
          })
          .catch(function (e) {
            statusEl.textContent = 'Error loading pins: ' + e.message;
            console.error(e);
          });
      }
    }

    function fitIfNeeded(bounds) {
      if (bounds.length > 0) {
        map.fitBounds(L.latLngBounds(bounds), { padding: [30, 30] });
      }
    }

    // ── GSM Alert polling ─────────────────────────────────────────────────
    var lastAlertTimestamp = 0;
    var dismissedAlertTimestamp = 0;

    function checkGsmAlerts() {
      fetch('/alerts')
        .then(function (r) { return r.json(); })
        .then(function (alerts) {
          if (!alerts || alerts.length === 0) return;
          var latest = alerts[alerts.length - 1];
          if (latest.timestamp > lastAlertTimestamp && latest.timestamp > dismissedAlertTimestamp) {
            lastAlertTimestamp = latest.timestamp;
            var cellIds = latest.gsm_cells.map(function (c) { return c.cell_id || 'Unknown'; }).join(', ');
            var msg = latest.gsm_cells.length + ' GSM cell(s) detected';
            if (latest.lat != null && latest.lon != null) {
              msg += ' at (' + Number(latest.lat).toFixed(4) + ', ' + Number(latest.lon).toFixed(4) + ')';
            }
            msg += ' — Cell IDs: ' + cellIds;
            document.getElementById('gsm-alert-text').textContent = msg;
            document.getElementById('gsm-alert-banner').style.display = 'block';
          }
        })
        .catch(function (e) { console.error('alerts error', e); });
    }

    function dismissGsmAlert() {
      dismissedAlertTimestamp = lastAlertTimestamp;
      document.getElementById('gsm-alert-banner').style.display = 'none';
    }

    // Initialise
    loadCellIds();
    updateMap(true);
    checkGsmAlerts();
    // Main data polling: 15s interval (map_data + cell_map + alerts)
    setInterval(function () {
      updateMap(false);
      checkGsmAlerts();
    }, 15000);
    // Cell ID list changes rarely – poll at 60s interval
    setInterval(loadCellIds, 60000);
  </script>
</body>

</html>
